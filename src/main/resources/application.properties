spring.application.name=dev_back_end

# --- Configuracoes do Banco de Dados (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=senha_banco
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuracoes do JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect